name: Restrict contributions

on:
  pull_request_target:
    types: [opened, reopened]
  issues:
    types: [opened, reopened]

permissions:
  issues: write
  pull-requests: write

jobs:
  close-outsider-contributions:
    runs-on: ubuntu-latest
    steps:
      - name: Close contributions from non-contributors
        if: >-
          (github.event_name == 'pull_request_target' &&
          !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'), github.event.pull_request.author_association)) ||
          (github.event_name == 'issues' &&
          !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'), github.event.issue.author_association))
        uses: actions/github-script@v7
        with:
          script: |
            const number = context.issue.number;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: number,
              body: "Thanks for your interest. This repository currently accepts issues and pull requests from the owner, collaborators, and existing contributors only."
            });
            if (context.eventName === "pull_request_target") {
              await github.rest.pulls.update({
                ...context.repo,
                pull_number: number,
                state: "closed"
              });
            } else {
              await github.rest.issues.update({
                ...context.repo,
                issue_number: number,
                state: "closed"
              });
            }
